<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>模糊搜尋 + 高亮 + QR Code + 藥品外觀</title>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    input {
      width: 300px;
      padding: 8px;
      font-size: 16px;
    }
    table {
      margin-top: 20px;
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    mark {
      background-color: yellow;
      font-weight: bold;
    }
    img.qr {
      width: 64px;
      height: 64px;
    }
  </style>
</head>
<body>
  <h2>🔍 模糊搜尋 + 高亮 + QR Code + 藥品外觀</h2>
  <input type="text" id="searchInput" placeholder="輸入關鍵字..." />
  <div id="tableContainer">請輸入關鍵字進行搜尋</div>

  <script>
    let originalData = [];
    let headers = [];
    let fuse;

    window.onload = function () {
      google.script.run.withSuccessHandler(initTable).getSheetData();
    };

    function initTable(data) {
      if (!data || data.length < 2) {
        document.getElementById("tableContainer").innerText = "沒有資料";
        return;
      }

      headers = data[0];
      const rows = data.slice(1);
      originalData = rows.map(row => {
        let obj = {};
        headers.forEach((h, i) => obj[h] = row[i]);
        return obj;
      });

      fuse = new Fuse(originalData, {
        keys: headers,
        threshold: 0.4,
        includeMatches: true
      });

      document.getElementById("tableContainer").innerText = "請輸入關鍵字進行搜尋";
    }

    document.getElementById("searchInput").addEventListener("input", function () {
      const keyword = this.value.trim();
      if (!keyword) {
        document.getElementById("tableContainer").innerHTML = "";
        return;
      }

      const results = fuse.search(keyword);
      renderTable(results);
    });

    function renderTable(results) {
  if (!results || results.length === 0) {
    document.getElementById("tableContainer").innerHTML = "沒有符合的資料";
    return;
  }

  let html = "<table><thead><tr>";
  html += "<th>QR Code</th>";
  headers.forEach(h => html += `<th>${h}</th>`);
  html += "<th>藥品外觀</th>"; // ✅ 新增欄位
  html += "</tr></thead><tbody>";

  results.forEach(result => {
    const row = result.item;
    const matchMap = {};

    if (result.matches) {
      result.matches.forEach(m => {
        matchMap[m.key] = m.indices;
      });
    }

    const qrContent = row["料位號"] ? `${row["料位號"]}00199999999` : "";
    const qrUrl = qrContent
      ? `https://api.qrserver.com/v1/create-qr-code/?size=64x64&data=${encodeURIComponent(qrContent)}`
      : "";

    html += "<tr>";
    html += `<td>${qrUrl ? `<img class="qr" src="${qrUrl}" alt="QR">` : "N/A"}</td>`;

    headers.forEach(h => {
      const val = String(row[h] ?? "");
      if (matchMap[h]) {
        html += `<td>${highlightMatch(val, matchMap[h])}</td>`;
      } else {
        html += `<td>${val}</td>`;
      }
    });

    // ✅ 新增「藥品外觀」欄位，使用 encodeURIComponent 保護網址參數
    const drugId = row["藥品編號"];
    let drugLink = "無資料";
    if (drugId) {
      const safeId = encodeURIComponent(String(drugId));
      const href = `https://www.cgmh.org.tw/tw/Services/DrugSearch?keyword=${safeId}`;
      drugLink = `<a href="${href}" target="_blank">查看</a>`;
    }
    html += `<td>${drugLink}</td>`;

    html += "</tr>";
  });

  html += "</tbody></table>";
  document.getElementById("tableContainer").innerHTML = html;
}


    function highlightMatch(text, indices) {
      let result = "";
      let lastIndex = 0;

      indices.forEach(([start, end]) => {
        result += escapeHTML(text.slice(lastIndex, start));
        result += `<mark>${escapeHTML(text.slice(start, end + 1))}</mark>`;
        lastIndex = end + 1;
      });

      result += escapeHTML(text.slice(lastIndex));
      return result;
    }

    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
